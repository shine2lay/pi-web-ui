<span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; white-space: nowrap; color: {{fg}}; background: {{bg}}; border: 1px {{bs}} {{bd}}">
<sc-if value="{{isWorking}}" hint-placeholder-val="{{true}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><circle cx="8" cy="8" r="2.6" fill="currentColor" stroke="none"></circle></svg></sc-if>
<sc-if value="{{isWaiting}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 2h7M4.5 14h7"></path><path d="M5.2 2c0 3.2 5.6 3 5.6 6s-5.6 2.8-5.6 6M10.8 2c0 3.2-5.6 3-5.6 6s5.6 2.8 5.6 6"></path></svg></sc-if>
<sc-if value="{{isBlocked}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M3.8 3.8l8.4 8.4"></path></svg></sc-if>
<sc-if value="{{isOnHold}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.8V8l2.2 1.5"></path></svg></sc-if>
<sc-if value="{{isPaused}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9"></path></svg></sc-if>
<sc-if value="{{isIdle}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle></svg></sc-if>
<sc-if value="{{isError}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 2 14.5 13.5h-13z"></path><path d="M8 6.5v3.2"></path><circle cx="8" cy="11.7" r="0.7" fill="currentColor" stroke="none"></circle></svg></sc-if>
<sc-if value="{{isUnknown}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M6.3 6.3a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4"></path><circle cx="8" cy="11.5" r="0.7" fill="currentColor" stroke="none"></circle></svg></sc-if>
<sc-if value="{{isQueued}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h6"></path></svg></sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
<span>{{text}}</span>
</span>
