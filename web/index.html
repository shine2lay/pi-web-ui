<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- mobile-fixes: interactive-widget=resizes-content: on Android Chrome the on-screen keyboard
		     shrinks the page (not just the visible part), so the message box sits right above it and the
		     top bar stays put. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- PWA manifest: relative so nginx sub-path deployments (/pi/) resolve correctly -->
		<link rel="manifest" href="./manifest.webmanifest" />
		<meta name="theme-color" content="#0f172a" />
		<link rel="apple-touch-icon" href="./icons/icon-192.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>pi-web-ui — pi coding agent</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
